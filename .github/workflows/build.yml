name: build-ipa

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: app
        run: xcodegen generate

      - name: Build (unsigned)
        working-directory: app
        run: |
          xcodebuild \
            -project SLATE.xcodeproj \
            -scheme SLATE \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        working-directory: app
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/SLATE.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "::error::未找到构建产物 $APP_PATH"
            find build/Build/Products -maxdepth 3 -name "*.app" || true
            exit 1
          fi
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry SLATE.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: SLATE-ipa
          path: app/SLATE.ipa
          if-no-files-found: error
          retention-days: 14
